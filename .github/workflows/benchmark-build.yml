name: Benchmark Build

on:
  push:
    branches:
      - benchmark-complete
  pull_request:
    branches:
      - development
    paths:
      - "FSM_Benchmark/**"
      - "global.json"
      - ".github/workflows/benchmark-build.yml"
      - "Documentation/BuildValidation.md"
  workflow_dispatch:
    inputs:
      run_calibrated_benchmark:
        description: "Run the full BenchmarkDotNet abstraction-overhead measurement (not the Dry smoke test)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmark-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build benchmark suite (.NET 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore FSM_Benchmark/FSM_Benchmark.csproj

      - name: Build Release
        run: dotnet build FSM_Benchmark/FSM_Benchmark.csproj --configuration Release --no-restore

      - name: Smoke-test abstraction overhead benchmarks
        run: dotnet run --project FSM_Benchmark/FSM_Benchmark.csproj --configuration Release --no-build --framework net10.0 -- --filter "*FSM_AbstractionOverheadBenchmarks*" --job Dry

      # A commit explicitly tagged [benchmark] opts into a real BenchmarkDotNet
      # run. Ordinary pushes and PR validation remain fast smoke/build checks.
      - name: Run calibrated abstraction overhead benchmarks
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]')) || (github.event_name == 'workflow_dispatch' && inputs.run_calibrated_benchmark)
        run: dotnet run --project FSM_Benchmark/FSM_Benchmark.csproj --configuration Release --no-build --framework net10.0 -- --filter "*FSM_AbstractionOverheadBenchmarks*" --artifacts ./BenchmarkDotNet.Artifacts

      - name: Upload BenchmarkDotNet results
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]')
        uses: actions/upload-artifact@v4
        with:
          name: abstraction-overhead-benchmark-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: error
          retention-days: 30
